<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jasmine Reads</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234a0e1c'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='%23cfa65e' font-family='Georgia,serif' font-weight='bold'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&family=Jost:wght@400;500&display=swap">
<style>
:root{--ox:#2b0810;--wine:#4a0e1c;--rose:#e9b8c0;--gold:#cfa65e;--ivory:#f7ebe6;--mute:#c79aa3;--line:rgba(233,184,192,.22);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#6b1226 0,var(--ox) 60%) var(--ox);color:var(--ivory);font:400 16px/1.6 Jost,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px 60px}
header{text-align:center;padding:48px 0 20px}header a{color:inherit;text-decoration:none}
.script{font-family:"Pinyon Script",cursive;color:var(--gold);font-size:30px;line-height:1}
header h1{font-size:clamp(46px,10vw,88px);line-height:1;margin:6px 0 10px}
header p{font:italic 500 21px "Cormorant Garamond",serif;color:var(--rose);margin:0 auto;max-width:34ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:24px 0;padding:14px 0;border-block:1px solid var(--line)}
input,textarea,select{font:inherit;color:var(--ivory);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:999px;padding:11px 16px;max-width:100%}
#q{width:300px;max-width:100%}
textarea{border-radius:16px;width:100%;min-height:120px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mute)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;color:var(--ivory);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px}
button:hover{border-color:var(--rose)}
.chip[aria-pressed=true]{background:var(--rose);color:var(--ox);border-color:var(--rose)}
.primary{background:var(--gold);color:var(--ox);border-color:var(--gold);font-weight:500}
.big{display:block;width:100%;padding:18px;font-size:18px;border-radius:18px;text-align:center}
.stack{display:grid;gap:14px;max-width:460px;margin-top:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 22px}
.book{all:unset;cursor:pointer;display:block}
.book:focus-visible .cover{outline:2px solid var(--gold);outline-offset:4px}
.cover{aspect-ratio:2/3;border-radius:3px 10px 10px 3px;overflow:hidden;background:linear-gradient(160deg,#7a1f2e,#3a0a14);box-shadow:-5px 6px 0 rgba(0,0,0,.28),0 14px 28px rgba(0,0,0,.45);transition:transform .25s;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font:600 20px/1.1 "Cormorant Garamond",serif}
.cover img{width:100%;height:100%;object-fit:cover;display:block;margin:-14px}
.cover.has{padding:0}.cover.has img{margin:0}
.book:hover .cover{transform:translateY(-6px) rotate(-1.2deg)}
.meta{margin-top:10px;font-size:14px;color:var(--rose)}
.stars{color:var(--gold);letter-spacing:2px}
.empty{text-align:center;color:var(--mute);padding:36px 0;grid-column:1/-1}
.detail{display:grid;grid-template-columns:240px 1fr;gap:36px;margin-top:20px}
@media(max-width:700px){.detail{grid-template-columns:1fr}.detail .cover{max-width:240px;margin:0 auto}}
.detail h2{font-size:clamp(34px,6vw,52px);line-height:1.05}
.quote{font:500 22px/1.5 "Cormorant Garamond",serif;max-width:60ch;white-space:pre-wrap}
details{margin-top:16px;color:var(--mute)}summary{cursor:pointer;color:var(--rose)}
.panel{margin-top:40px;padding-top:26px;border-top:1px solid var(--line)}
.rev{padding:14px 0;border-bottom:1px solid var(--line)}.rev p{margin:4px 0 0;white-space:pre-wrap}
.hint,small{color:var(--mute)}
form,.form{display:grid;gap:12px;max-width:560px;margin-top:16px}
label{display:grid;gap:4px;color:var(--rose)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ok{color:var(--gold)}.err{color:#ffb4b4}
.hp{position:absolute;left:-9999px}
.res{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border-radius:14px;padding:10px;margin-top:10px}
.res img,.res .ph{width:48px;height:72px;object-fit:cover;border-radius:3px;background:var(--wine);flex:none}
.q{padding:16px;border:1px solid var(--line);border-radius:14px;margin-top:12px;background:rgba(0,0,0,.2)}
.badge{background:var(--gold);color:var(--ox);border-radius:999px;padding:0 8px;margin-left:6px;font-size:14px}
.star{font-size:30px;padding:2px 6px;border:0;color:var(--mute)}.star.on{color:var(--gold)}
footer{text-align:center;padding:30px 0;font-size:13px}footer a{color:var(--mute)}
@media(prefers-reduced-motion:reduce){.cover{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header><a href="#"><div class="script">welcome to</div><h1>Jasmine Reads</h1></a><p>Every book I've finished, and what I really thought.</p></header>
<main id="app"></main>
<footer><a href="#admin">Jasmine's login</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// PASTE YOUR TWO SUPABASE VALUES HERE (Project Settings > API)
const SB_URL="https://eyhxqstanetuqdkaqdun.supabase.co", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5aHhxc3RhbmV0dXFka2FxZHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjUyOTgsImV4cCI6MjEwNzk0MTI5OH0.E_say_Mtt2wJUmN4scbAX1qS-26d8lDG5rtIsfZ0atc";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stars=n=>"★".repeat(n||0)+"☆".repeat(5-(n||0));
const msg=t=>`<p class="empty">${t}</p>`;
let books=[],filter="All",draft=null,results=[];

async function load(){const{data,error}=await sb.from("books").select("*").order("created_at",{ascending:false});books=data||[];return !error}
const cover=b=>`<div class="cover ${b.cover_url?"has":""}">${b.cover_url?`<img src="${esc(b.cover_url)}" alt="Cover of ${esc(b.title)}" loading="lazy">`:esc(b.title)}</div>`;

async function route(){window.scrollTo(0,0);const h=location.hash.slice(1);
if(h.startsWith("book/"))return bookPage(h.slice(5));
if(h=="admin")return admin();
await home()}

async function home(){
$("app").innerHTML=msg("Loading the shelf…");
if(!await load())return $("app").innerHTML=msg("The shelf couldn't load. Refresh the page in a minute.");
const gs=["All",...new Set(books.map(b=>b.genre).filter(Boolean))];
$("app").innerHTML=`<div class="bar"><input id="q" type="search" placeholder="Search title or author" aria-label="Search books"><div class="chips">${gs.map(g=>`<button class="chip" aria-pressed="${g==filter}" data-a="filter" data-v="${esc(g)}">${esc(g)}</button>`).join("")}</div></div><div class="grid" id="grid"></div>`;
$("q").oninput=grid;grid()}
function grid(){const q=$("q").value.toLowerCase();
const l=books.filter(b=>(filter=="All"||b.genre==filter)&&((b.title||"")+" "+(b.author||"")).toLowerCase().includes(q));
$("grid").innerHTML=l.length?l.map(b=>`<button class="book" data-a="book" data-v="${b.id}" aria-label="${esc(b.title)}, open review">${cover(b)}<div class="meta">${esc(b.title)}<br><span class="stars">${stars(b.rating)}</span></div></button>`).join(""):msg(books.length?"No books match that search. Clear the search or pick All.":"Jasmine hasn't added any books yet. Check back soon.")}

async function bookPage(id){
$("app").innerHTML=msg("Loading…");
const{data:b}=await sb.from("books").select("*").eq("id",id).single();
if(!b)return $("app").innerHTML=msg("That book isn't on the shelf. <a href='#' style='color:var(--gold)'>Back to the shelf</a>");
const{data:rs}=await sb.from("reviews").select("*").eq("book_id",id).eq("approved",true).order("created_at");
$("app").innerHTML=`<button onclick="location.hash=''">Back to the shelf</button>
<div class="detail"><div>${cover(b)}</div><div><h2>${esc(b.title)}</h2><div class="meta">${esc(b.author)}${b.genre?" · "+esc(b.genre):""} · <span class="stars">${stars(b.rating)}</span></div>
<p class="quote">${esc(b.review)}</p>${b.description?`<details><summary>About the book</summary><p>${esc(b.description)}</p></details>`:""}</div></div>
<section class="panel"><h3 style="font-size:32px">What readers think</h3>
${(rs||[]).length?rs.map(r=>`<div class="rev"><span class="stars">${stars(r.rating)}</span> <strong>${esc(r.name)}</strong><p>${esc(r.body)}</p></div>`).join(""):'<p class="hint">No reader reviews yet. Be the first to share your thoughts.</p>'}
<h3 style="font-size:26px;margin-top:30px">Add your review</h3>
<form id="rf"><div class="row"><input name="name" placeholder="Your name" required maxlength="40" aria-label="Your name"><select name="rating" aria-label="Rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} star${n>1?"s":""}</option>`).join("")}</select></div>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><textarea name="body" placeholder="What did you think?" required maxlength="800" aria-label="Your review"></textarea>
<div><button class="primary" type="submit">Send for approval</button></div><p id="st"></p></form></section>`;
$("rf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
if(f.get("website"))return;
const{error}=await sb.from("reviews").insert({book_id:id,name:f.get("name").trim(),rating:+f.get("rating"),body:f.get("body").trim(),approved:false});
$("st").className=error?"err":"ok";$("st").textContent=error?"That didn't send. Check your connection and try again.":"Sent! Jasmine reads every review before it appears here.";if(!error)e.target.reset()}}

/* ---------- Jasmine's admin ---------- */
async function admin(){const{data:{session}}=await sb.auth.getSession();
if(!session)return $("app").innerHTML=`<h2 style="font-size:40px">Jasmine's login</h2><form id="lf"><input name="e" type="email" placeholder="Email" required autocomplete="username"><input name="p" type="password" placeholder="Password" required autocomplete="current-password"><div><button class="primary" type="submit">Log in</button></div><p id="st" class="err"></p></form>`,
$("lf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const{error}=await sb.auth.signInWithPassword({email:f.get("e").trim(),password:f.get("p")});if(error)$("st").textContent="That email or password isn't right. Try again.";else adminView("home")};
adminView("home")}

async function adminView(v){const A=$("app");window.scrollTo(0,0);
const back='<button data-a="adm" data-v="home">← Back to menu</button>';
if(v=="home"){const{count}=await sb.from("reviews").select("id",{count:"exact",head:true}).eq("approved",false);
A.innerHTML=`<h2 style="font-size:42px">Hi Jasmine 🤍</h2><div class="stack"><button class="big primary" data-a="adm" data-v="add">Add a book</button><button class="big" data-a="adm" data-v="rev">Reviews waiting for you${count?`<span class="badge">${count}</span>`:""}</button><button class="big" data-a="adm" data-v="mine">My books</button><button class="big" data-a="logout">Log out</button></div>`}
else if(v=="add"){results=[];A.innerHTML=`${back}<h2 style="font-size:36px;margin-top:14px">Add a book</h2><p class="hint">Type the book's name. Tap the right one and its cover and description fill in for you.</p>
<form id="sf"><input id="sq" placeholder="Book name or author" required><div><button class="primary" type="submit">Find my book</button></div></form><div id="res"></div>
<p class="hint" style="margin-top:26px">Can't find it? <button data-a="manual">Add it by hand with a photo of the cover</button></p>`;
$("sf").onsubmit=async e=>{e.preventDefault();$("res").innerHTML=msg("Searching…");
try{const r=await fetch("https://openlibrary.org/search.json?limit=8&fields=key,title,author_name,cover_i,subject&q="+encodeURIComponent($("sq").value));results=(await r.json()).docs||[]}catch(x){return $("res").innerHTML=msg("The book search isn't answering right now. Try again in a moment, or add it by hand.")}
$("res").innerHTML=results.length?results.map((r,i)=>`<button class="res" data-a="pick" data-v="${i}">${r.cover_i?`<img src="https://covers.openlibrary.org/b/id/${r.cover_i}-M.jpg" alt="">`:'<span class="ph"></span>'}<span><strong>${esc(r.title)}</strong><br><small>${esc((r.author_name||[])[0])}</small></span></button>`).join(""):msg("No matches. Try fewer words, or add it by hand below.")}}
else if(v=="form"){const d=draft;
A.innerHTML=`<button data-a="adm" data-v="${d.id?"mine":"add"}">← Back</button><h2 style="font-size:36px;margin:14px 0">${d.id?"Edit book":"Your review"}</h2>
<div class="form"><div class="detail" style="grid-template-columns:120px 1fr;gap:16px;margin:0"><div id="pv">${cover(d)}</div><div><p class="hint">Cover</p><label>Use my own photo<input type="file" id="ph" accept="image/*"></label></div></div>
<label>Title<input id="f_t" value="${esc(d.title)}"></label><label>Author<input id="f_a" value="${esc(d.author)}"></label>
<label>Genre<select id="f_g"><option value="">Choose a genre</option>${GENRES.map(g=>`<option value="${esc(g)}" ${g==d.genre?"selected":""}>${esc(g)}</option>`).join("")}<option value="__o" ${d.genre&&!GENRES.includes(d.genre)?"selected":""}>Other…</option></select></label><input id="f_go" placeholder="Type your own genre" value="${d.genre&&!GENRES.includes(d.genre)?esc(d.genre):""}" ${d.genre&&!GENRES.includes(d.genre)?"":"hidden"}>
<div>My rating<div id="st5">${[1,2,3,4,5].map(n=>`<button class="star ${n<=d.rating?"on":""}" data-a="rate" data-v="${n}" aria-label="${n} stars">★</button>`).join("")}</div></div>
<label>What I thought<textarea id="f_r" style="min-height:180px">${esc(d.review)}</textarea></label>
<label>About the book<textarea id="f_d">${esc(d.description)}</textarea></label>
<button class="big primary" data-a="save">Save to my shelf</button><p id="st"></p></div>`;
$("f_g").onchange=()=>{$("f_go").hidden=$("f_g").value!="__o"};
$("ph").onchange=e=>{const f=e.target.files[0];if(f){d.file=f;$("pv").innerHTML=`<div class="cover has"><img src="${URL.createObjectURL(f)}" alt=""></div>`}}}
else if(v=="mine"){await load();A.innerHTML=`${back}<h2 style="font-size:36px;margin:14px 0">My books</h2>${books.length?books.map(b=>`<div class="q"><strong>${esc(b.title)}</strong> <small>${esc(b.author)}</small><div style="margin-top:8px"><button data-a="edit" data-v="${b.id}">Edit</button> <button data-a="del" data-v="${b.id}">Delete</button></div></div>`).join(""):msg("No books yet. Tap Back, then Add a book.")}`}
else if(v=="rev"){const{data}=await sb.from("reviews").select("*,books(title)").eq("approved",false).order("created_at");
A.innerHTML=`${back}<h2 style="font-size:36px;margin:14px 0">Reviews waiting for you</h2><p class="hint">Nothing shows on the site until you tap Approve.</p>${(data||[]).length?data.map(r=>`<div class="q"><small>On ${esc(r.books?.title)}</small><div><span class="stars">${stars(r.rating)}</span> <strong>${esc(r.name)}</strong></div><p>${esc(r.body)}</p><button class="primary" data-a="ok" data-v="${r.id}">Approve</button> <button data-a="no" data-v="${r.id}">Delete</button></div>`).join(""):msg("Nothing waiting. New reviews will show up here.")}`}}

const GENRES=["Fantasy","Romance","Classics","Mystery & Thriller","Sci-Fi","Historical Fiction","Contemporary Fiction","Young Adult","Horror","Self-help","Non-fiction","Memoir","Poetry","Faith & Spirituality"];
const blank=()=>({title:"",author:"",genre:"",description:"",cover_url:"",rating:5,review:""});
async function compress(f){const bm=await createImageBitmap(f);const s=Math.min(1,700/bm.width);const c=document.createElement("canvas");c.width=bm.width*s;c.height=bm.height*s;c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.82))}

document.addEventListener("click",async e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v;
if(a=="filter"){filter=v;const q=$("q").value;await home();$("q").value=q;grid()}
else if(a=="book")location.hash="book/"+v;
else if(a=="adm")adminView(v);
else if(a=="logout"){await sb.auth.signOut();location.hash="";location.reload()}
else if(a=="manual"){draft=blank();adminView("form")}
else if(a=="pick"){const r=results[v];draft=Object.assign(blank(),{title:r.title,author:(r.author_name||[])[0]||"",genre:"",cover_url:r.cover_i?`https://covers.openlibrary.org/b/id/${r.cover_i}-L.jpg`:""});
try{const w=await(await fetch(`https://openlibrary.org${r.key}.json`)).json();const d=w.description;draft.description=(typeof d=="string"?d:d?.value||"").split("\r\n----")[0].trim()}catch(x){}
adminView("form")}
else if(a=="rate"){draft.rating=+v;document.querySelectorAll(".star").forEach((s,i)=>s.classList.toggle("on",i<+v))}
else if(a=="edit"){draft={...books.find(b=>b.id==v)};adminView("form")}
else if(a=="del"){if(confirm("Delete this book and its reviews?")){await sb.from("books").delete().eq("id",v);adminView("mine")}}
else if(a=="ok"){await sb.from("reviews").update({approved:true}).eq("id",v);adminView("rev")}
else if(a=="no"){await sb.from("reviews").delete().eq("id",v);adminView("rev")}
else if(a=="save"){const st=$("st");const title=$("f_t").value.trim();if(!title){st.className="err";st.textContent="Add a title first.";return}
st.className="ok";st.textContent="Saving…";t.disabled=true;
try{let url=draft.cover_url;
if(draft.file){const p=`${Date.now()}.jpg`;const up=await sb.storage.from("covers").upload(p,await compress(draft.file),{contentType:"image/jpeg"});if(up.error)throw up.error;url=sb.storage.from("covers").getPublicUrl(p).data.publicUrl}
const row={title,author:$("f_a").value.trim(),genre:$("f_g").value=="__o"?$("f_go").value.trim():$("f_g").value,rating:draft.rating,review:$("f_r").value,description:$("f_d").value,cover_url:url};
const{error}=draft.id?await sb.from("books").update(row).eq("id",draft.id):await sb.from("books").insert(row);if(error)throw error;
await adminView("mine");}catch(x){t.disabled=false;st.className="err";st.textContent="That didn't save. Check your internet and tap Save again."}}});
addEventListener("hashchange",route);route();
</script>
</body>
</html>
